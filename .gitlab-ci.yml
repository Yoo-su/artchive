# ==============================================================================
# GitLab CI/CD 파이프라인 설정
# develop 브랜치에 push 시 자동으로 Docker 이미지를 빌드하고 Registry에 저장합니다.
# ==============================================================================

# 모든 Job이 기본으로 사용할 Docker 이미지
# docker:27 이미지 안에서 docker build 명령어를 실행합니다.
image: docker:27

# Docker-in-Docker (dind) 서비스
# GitLab CI의 Job은 컨테이너 안에서 실행되는데,
# 그 안에서 또 docker build를 해야 하므로 "도커 안의 도커"가 필요합니다.
services:
  - docker:27-dind

# 전역 변수 설정
variables:
  # dind 서비스와 통신하기 위한 설정
  DOCKER_TLS_CERTDIR: "/certs"
  # GitLab Container Registry 주소 (GitLab이 무료로 제공하는 이미지 저장소)
  REGISTRY: registry.gitlab.com/yoo-su-group/bookjeok

# 파이프라인 스테이지 정의 (순서대로 실행)
stages:
  - build

# ==============================================================================
# Web 이미지 빌드 & Registry에 Push
# ==============================================================================
build-web:
  stage: build
  script:
    # 1. GitLab Container Registry에 로그인
    #    CI_REGISTRY_PASSWORD는 GitLab이 자동으로 제공하는 토큰입니다.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

    # 2. Web Docker 이미지 빌드
    #    -f: Dockerfile 위치 지정
    #    -t: 이미지 이름과 태그 지정 (Registry 주소 포함)
    - docker build -f apps/web/Dockerfile -t $REGISTRY/web:latest -t $REGISTRY/web:$CI_COMMIT_SHORT_SHA .

    # 3. 빌드된 이미지를 Registry에 Push (저장)
    - docker push $REGISTRY/web:latest
    - docker push $REGISTRY/web:$CI_COMMIT_SHORT_SHA
  only:
    - develop

# ==============================================================================
# Server 이미지 빌드 & Registry에 Push
# ==============================================================================
build-server:
  stage: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -f apps/server/Dockerfile -t $REGISTRY/server:latest -t $REGISTRY/server:$CI_COMMIT_SHORT_SHA .
    - docker push $REGISTRY/server:latest
    - docker push $REGISTRY/server:$CI_COMMIT_SHORT_SHA
  only:
    - develop
